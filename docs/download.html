<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Password Keeper - Download</title>
    <meta name="theme-color" content="#D85A30" />
    <link rel="icon" type="image/svg+xml" href="./assets/praesens_simbolo.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #FAECE7;
        --surface: #ffffff;
        --text: #4A1B0C;
        --muted: #444441;
        --line: #F5C4B3;
        --accent: #993C1D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #4A1B0C;
          --surface: #4A1B0C;
          --text: #FAECE7;
          --muted: #F5C4B3;
          --line: #993C1D;
          --accent: #F0997B;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      }

      main {
        width: min(520px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 20px;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main>
      <picture style="display:block; padding:30px; margin-bottom:24px">
        <source media="(prefers-color-scheme: dark)" srcset="./assets/praesens_logo_escuro.svg" />
        <img src="./assets/praesens_logo_principal.svg" alt="Praesens.tech" width="180" height="48" />
      </picture>
      <h1 id="title">Preparando download</h1>
      <p id="message">Seu download deve comecar automaticamente em instantes.</p>
      <p><a href="./" id="fallback">Voltar para a pagina inicial</a></p>
    </main>

    <script>
      const downloads = {
        "windows-exe": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_x64-setup.exe",
        "windows-msi": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_x64_en-US.msi",
        "mac-arm": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_aarch64.dmg",
        "mac-intel": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_x64.dmg",
        "linux-appimage": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_amd64.AppImage",
        "linux-deb": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper_0.2.9_amd64.deb",
        "linux-rpm": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/Password.Keeper-0.2.9-1.x86_64.rpm",
        "android-apk": "https://github.com/Praesens-tech/passwordKeeper/releases/download/v0.2.9/PasswordKeeper-0.2.9-android.apk"
      };

      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const target = downloads[file];
      const isPortuguese = /^pt(?:-|$)/.test((navigator.language || "en").toLowerCase());
      document.documentElement.lang = isPortuguese ? "pt-BR" : "en";
      if (!isPortuguese) {
        document.getElementById("title").textContent = "Preparing download";
        document.getElementById("message").textContent = "Your download should start automatically shortly.";
        document.getElementById("fallback").textContent = "Back to the home page";
      }

      if (target) {
        window.location.replace(target);
      } else {
        document.getElementById("title").textContent = isPortuguese ? "Download nao encontrado" : "Download not found";
        document.getElementById("message").textContent = isPortuguese
          ? "Volte para a pagina inicial e escolha uma das opcoes disponiveis."
          : "Return to the home page and choose one of the available options.";
      }
    </script>
  </body>
</html>
