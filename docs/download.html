<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Password Keeper - Download</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f9f7;
        --surface: #ffffff;
        --text: #101615;
        --muted: #5c6864;
        --line: #d8e4dd;
        --accent: #0f9f6e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07100d;
          --surface: #0d1814;
          --text: #eff7f2;
          --muted: #a6b8af;
          --line: #25372f;
          --accent: #34d399;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(520px, 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        padding: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 8vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Preparando download</h1>
      <p id="message">Seu download deve comecar automaticamente em instantes.</p>
      <p><a href="./" id="fallback">Voltar para a pagina inicial</a></p>
    </main>

    <script>
      const downloads = {
        "windows-exe": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_x64-setup.exe",
        "windows-msi": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_x64_en-US.msi",
        "mac-arm": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_aarch64.dmg",
        "mac-intel": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_x64.dmg",
        "linux-appimage": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_amd64.AppImage",
        "linux-deb": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper_0.2.8_amd64.deb",
        "linux-rpm": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/Password.Keeper-0.2.8-1.x86_64.rpm",
        "android-apk": "https://github.com/mpblima/passwordKeeper/releases/download/v0.2.8/PasswordKeeper-0.2.8-android.apk"
      };

      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const target = downloads[file];

      if (target) {
        window.location.replace(target);
      } else {
        document.getElementById("title").textContent = "Download nao encontrado";
        document.getElementById("message").textContent = "Volte para a pagina inicial e escolha uma das opcoes disponiveis.";
      }
    </script>
  </body>
</html>
